<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Proscreen — HTML5 ZIP Test</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <!-- Header: Clock + Weather -->
  <div class="header">
    <div>
      <div class="clock" id="clock-time">--:--:--</div>
      <div class="clock-date" id="clock-date">--</div>
    </div>
    <div class="weather" id="weather-content">
      <div class="weather-offline">Ladataan säätietoja...</div>
    </div>
  </div>

  <!-- Video / Canvas placeholder area -->
  <div class="video-area">
    <canvas id="placeholder-canvas"></canvas>
    <video id="local-video" muted loop playsinline autoplay style="display:none;">
      <!-- Testaaja: lisää MP4-tiedosto assets/ -kansioon ja päivitä src -->
      <!-- <source src="assets/video.mp4" type="video/mp4"> -->
    </video>
  </div>

  <!-- Scrolling ticker bar -->
  <div class="ticker-bar">
    <span class="ticker-text">
      ★ PROSCREEN HTML5 ZIP PACKAGE TEST ★ Dynaaminen sisältö SD-kortilta ★ Kello, sää, video, CSS-animaatiot ★ Testataan BrightSign-yhteensopivuutta ★
    </span>
  </div>
</div>

<!-- CSS animation test: pulsing corners -->
<div class="pulse-corner tl"></div>
<div class="pulse-corner tr"></div>
<div class="pulse-corner bl"></div>
<div class="pulse-corner br"></div>


<script src="js/app.js"></script>
</body>
</html>
